# =============================================================================
#  Catálogo de datos — PostgreSQL para consultar/actualizar desde Databricks.
#
#  Stack independiente (no tiene que ver con TimeShift). Una sola DB, pensada
#  para ~250k filas en 2 tablas. Databricks se conecta por JDBC al IP:puerto
#  público de este servidor (igual que ya haces con el SQL Server de Arsys).
#
#  Uso:
#    cp .env.example .env            # y pon una contraseña fuerte
#    docker compose up -d
#    docker compose logs -f postgres
#
#  OJO: los .sql de ./initdb SOLO se aplican la PRIMERA vez (volumen vacío).
#  Si cambias el esquema después, aplícalo a mano con psql.
# =============================================================================

name: catalogo-db

services:
  postgres:
    image: postgres:16-alpine
    container_name: databricks-catalog-db
    env_file: .env
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-catalogo}"
      POSTGRES_USER: "${POSTGRES_USER:-catalogo}"
      # El :? hace que compose falle si no defines la contraseña en .env.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}"
      # scram-sha-256: hashing moderno para las conexiones remotas.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      # Este es el puerto que verá Databricks. Cámbialo en .env si quieres uno
      # no estándar (recomendado si lo expones a internet).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - catalogo-data:/var/lib/postgresql/data
      # Scripts de esquema/seed: se ejecutan en orden alfabético SOLO al crear
      # la base por primera vez (cuando el volumen está vacío).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      # Ajustes holgados de sobra para 250k filas.
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalogo} -d ${POSTGRES_DB:-catalogo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [catalogo-net]

  # ── API FastAPI de solo lectura para terceros (detrás de Caddy) ────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: databricks-catalog-api:local
    container_name: databricks-catalog-api
    env_file: .env
    environment:
      # La API habla con Postgres por la red privada (nombre del servicio).
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-catalogo}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-catalogo}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      RATE_LIMIT: "${RATE_LIMIT:-1080/minute}"
      # Proxies de confianza para X-Forwarded-For (IP real del cliente para el
      # rate limit). "*" es aceptable porque la API no publica puertos: solo la
      # alcanzan contenedores de catalogo-net/edge (Caddy). Si en `edge` hay
      # otros contenedores, pon aquí la IP/subred de Caddy.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-*}"
      # Firma de los JWT (obligatorio) y caducidad del token.
      JWT_SECRET: "${JWT_SECRET:?define JWT_SECRET en .env}"
      ACCESS_TOKEN_EXPIRE_HOURS: "${ACCESS_TOKEN_EXPIRE_HOURS:-12}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # catalogo-net: para llegar a Postgres.  edge: para que Caddy la alcance.
    networks: [catalogo-net, edge]
    # Sin "ports": Caddy la publica en 443. Para probar en local, descomenta:
    # ports:
    #   - "8000:8000"

  # ── Servidor MCP del catálogo (remoto, detrás de Caddy) ────────────────────
  # Expone la API como herramientas MCP por Streamable HTTP en /mcp. Lo alcanza
  # Caddy (red edge) y publica en https://mcp-bycos.data4tex.com/mcp.
  mcp:
    build:
      context: ./mcp-catalogo
      dockerfile: Dockerfile
    image: databricks-catalog-mcp:local
    container_name: databricks-catalog-mcp
    env_file: .env
    environment:
      # Llama a la API por la red interna de Docker (no sale a internet).
      CATALOGO_BASE_URL: "http://api:8000"
      # Credenciales del usuario de la API (en .env): CATALOGO_USER / CATALOGO_PASSWORD.
      # Token que el MCP exige a los clientes (en .env, obligatorio en prod):
      MCP_API_KEY: "${MCP_API_KEY:?define MCP_API_KEY en .env}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # edge: Caddy la alcanza y, a la vez, llega a `api` (que también está en edge).
    networks: [edge]

  # ── ETL: SQL Server (Arsys) -> Postgres (reemplazo del pipeline Databricks) ──
  # Dos servicios, ambos tras el profile "etl" (no arrancan con el stack normal,
  # para no escribir en prod por sorpresa):
  #   - etl:      ejecución MANUAL puntual.
  #       docker compose run --rm etl <tabla> [--dry-run]
  #   - etl-cron: ejecución PROGRAMADA por cadencias (supercronic + etl/crontab).
  #       docker compose --profile etl up -d --build etl-cron
  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    image: databricks-catalog-etl:local
    container_name: databricks-catalog-etl
    env_file: .env
    environment: &etl-env
      # Postgres destino: por la red interna (servicio 'postgres', puerto 5432).
      PG_HOST: "postgres"
      PG_PORT: "5432"
      PG_DATABASE: "${POSTGRES_DB:-catalogo}"
      PG_USER: "${POSTGRES_USER:-catalogo}"
      PG_PASSWORD: "${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}"
      # SQL Server origen (Arsys): definir en .env.
      SQLSERVER_HOST: "${SQLSERVER_HOST:?define SQLSERVER_HOST en .env}"
      SQLSERVER_PORT: "${SQLSERVER_PORT:-4313}"
      SQLSERVER_DB: "${SQLSERVER_DB:-S4T_BYCOS}"
      SQLSERVER_USER: "${SQLSERVER_USER:?define SQLSERVER_USER en .env}"
      SQLSERVER_PASSWORD: "${SQLSERVER_PASSWORD:?define SQLSERVER_PASSWORD en .env}"
      TDS_VERSION: "${TDS_VERSION:-7.0}"
      TZ: "${TZ:-Europe/Madrid}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # catalogo-net: llega a Postgres y tiene salida a internet (SQL Server Arsys).
    networks: [catalogo-net]
    profiles: ["etl"]
    # Default seguro si se arranca con `up`: dry-run de sku. El uso normal es
    # `docker compose run --rm etl <tabla> [--dry-run]`.
    command: ["sku", "--dry-run"]

  # Ejecución programada: supercronic corre etl/crontab con las cadencias
  # (ticket_maestro y stock_talla 15 min, stock 30 min, cajas 1 h, sku 2 h,
  # compras_maestro 1×/día de madrugada). Un lock en Postgres serializa las
  # ejecuciones que coincidan en el mismo minuto.
  etl-cron:
    build:
      context: ./etl
      dockerfile: Dockerfile
    image: databricks-catalog-etl:local
    container_name: databricks-catalog-etl-cron
    env_file: .env
    environment:
      <<: *etl-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [catalogo-net]
    profiles: ["etl"]
    # tini (init: true) recoge los procesos zombie de los jobs; supercronic con
    # -no-reap no hace su propio reaping (que falla al re-ejecutarse como PID 1).
    init: true
    entrypoint: ["supercronic"]
    command: ["-no-reap", "/app/crontab"]

volumes:
  catalogo-data:

networks:
  # Red privada API <-> Postgres (este stack).
  catalogo-net:
    driver: bridge
  # Red compartida con el stack del reverse proxy (Caddy). Créala una vez:
  #   docker network create edge
  # y añade `edge` a las redes del servicio caddy en su compose.
  edge:
    external: true
